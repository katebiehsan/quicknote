<main class="app">
  <header class="top">
    <h1 class="sr-only">Quicknote</h1>
    <button class="pill" id="pill" type="button" aria-label="Übertragungsstand"><svg class="plink" aria-hidden="true"><use class="lk" href="#sf-link"/><use class="cx" href="#sf-icloud-slash"/></svg><span id="pillT">Lädt</span></button>
  </header>


  <section class="sec" id="pinSec" hidden>
    <button class="sh" id="pinTog" type="button" aria-expanded="true" aria-controls="pinBody"><span><svg class="pinic" aria-hidden="true"><use href="#sf-pin-fill"/></svg><b>Angeheftet</b><span class="n" id="pinN"></span></span></button>
    <div class="body" id="pinBody"><div><div class="list" id="pinList"></div></div></div>
  </section>

  <section class="sec" id="noteSec">
    <div class="sh static"><b>Notizen</b></div>
    <div class="list" id="list"></div>
    <div id="sentinel" hidden aria-hidden="true"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
</main>

<nav class="dock" aria-label="Aktionen">
  <label class="spill" id="qWrap"><svg aria-hidden="true"><use href="#sf-magnifyingglass"/></svg><input id="q" type="search" placeholder="Suchen" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Notizen durchsuchen"></label>
  <button class="plus" id="newBtn" type="button" aria-label="Neue Notiz"><svg aria-hidden="true"><use href="#sf-plus"/></svg></button>
  <button class="circ" id="qBtn" type="button" aria-label="Suche schließen" aria-expanded="false" aria-controls="qWrap"><svg class="i-x" aria-hidden="true"><use href="#sf-xmark"/></svg></button>
</nav>

<section class="cmp" id="cmp" hidden aria-label="Neue Notiz" role="dialog" aria-modal="true">
  <button class="cscrim" id="cmpClose" type="button" aria-label="Schließen" tabindex="-1"></button>
  <div class="card">
    <textarea id="ta" rows="1" placeholder="Neue Notiz" autocapitalize="sentences" enterkeyhint="enter" aria-label="Neue Notiz"></textarea>
    <div class="err" id="err" role="status"></div>
    <div class="chips">
      <button class="dchip" id="todoBtn" type="button"><span class="cb"></span>Aufgabe</button>
      <button class="dchip off" id="chip" type="button" aria-label="Termin-Vorschlag, antippen wechselt den Kalender"><i class="dot"></i><span id="chipT"></span></button>
    </div>
    <button class="go" id="saveBtn" type="button" aria-label="Sichern"><svg aria-hidden="true"><use href="#sf-checkmark"/></svg></button>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh-in">
    <div class="sh-head"><button type="button" id="shClose">Schließen</button><b id="shT">Notiz</b><button type="button" id="shDone" class="strong">Fertig</button></div>
    <div id="shBody"></div>
  </div>
</div>

<div class="toaster" id="toaster" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
