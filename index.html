<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quicknote">
<title>Quicknote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/qn2-180.png">
<link rel="icon" href="icons/qn2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="big">Quicknote</h1>
    <button class="pill" id="pill" type="button" aria-label="Übertragungsstand"><i></i><svg class="pok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path pathLength="1" d="M7.2 12.4l3.2 3.2 6.4-6.6"/></svg><span id="pillT">Lädt</span></button>
  </header>


  <section class="sec" id="pinSec" hidden>
    <button class="sh" id="pinTog" type="button" aria-expanded="true" aria-controls="pinBody"><span><b>Angeheftet</b><span class="n" id="pinN"></span></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="body" id="pinBody"><div><div class="list" id="pinList"></div></div></div>
  </section>

  <section class="sec" id="noteSec">
    <div class="sh static"><b>Notizen</b></div>
    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden></p>
  </section>
</main>

<nav class="dock" aria-label="Aktionen">
  <button class="circ" id="setBtn" type="button" aria-label="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <label class="spill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="q" type="search" placeholder="Suchen" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Notizen durchsuchen"></label>
  <button class="circ add" id="newBtn" type="button" aria-label="Neue Notiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<section class="cmp" id="cmp" hidden aria-label="Neue Notiz" role="dialog" aria-modal="true">
  <button class="circ" id="cmpClose" type="button" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="card">
    <textarea id="ta" rows="2" placeholder="Neue Notiz" autocapitalize="sentences" enterkeyhint="enter" aria-label="Neue Notiz"></textarea>
    <div class="err" id="err" role="status"></div>
    <div class="chips">
      <button class="dchip" id="todoBtn" type="button"><span class="cb"></span>Aufgabe</button>
      <button class="dchip off" id="chip" type="button" aria-label="Termin-Vorschlag, antippen wechselt den Kalender"><i class="dot"></i><span id="chipT"></span></button>
    </div>
  </div>
  <button class="go" id="saveBtn" type="button" aria-label="Sichern"><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M6.5 12.6l3.6 3.6 7.4-7.6"/></svg></button>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh-in">
    <div class="sh-head"><button type="button" id="shClose">Schließen</button><b id="shT">Notiz</b><button type="button" id="shDone" class="strong">Fertig</button></div>
    <div id="shBody"></div>
  </div>
</div>

<div class="toaster" id="toaster" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
